name: Collect Linkani subtitles

on:
  workflow_dispatch:
    inputs:
      anime_ids:
        description: '작품 ID 쉼표 구분. 비우면 전체 목록에서 수집'
        default: ''
        type: string
      catalog_pages:
        description: '이번에 추가 탐색할 목록 페이지 수. 0 = 남은 전체'
        default: '1'
        type: string
      max_works:
        description: '이번에 처리할 작품 수. 0 = 시간 제한까지'
        default: '2'
        type: string
      max_episodes:
        description: '이번에 확인할 회차 수. 0 = 시간 제한까지'
        default: '6'
        type: string
      resume_run_id:
        description: '이전 결과를 이어받을 Actions 실행 ID. 첫 실행은 비움'
        default: ''
        type: string
      delay_seconds:
        description: '요청 간 대기 시간(초)'
        default: '1'
        type: string
  pull_request:
    paths:
      - 'scripts/crawl-linkani-subtitles.py'
      - 'scripts/test_linkani_crawler.py'
      - '.github/workflows/linkani-subtitles.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: linkani-subtitles-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 330 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify crawler and checkpoint behavior
        run: python -m unittest discover -s scripts -p test_linkani_crawler.py -v
      - name: Restore previous collection and checkpoint
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: linkani-subtitles
          path: crawl-resume
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Collect separate subtitles only
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANIME_IDS: ${{ inputs.anime_ids }}
          CATALOG_PAGES: ${{ inputs.catalog_pages }}
          MAX_WORKS: ${{ inputs.max_works }}
          MAX_EPISODES: ${{ inputs.max_episodes }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          args = [sys.executable, '-u', 'scripts/crawl-linkani-subtitles.py', '--output', 'crawl-output']
          if os.environ['EVENT_NAME'] == 'pull_request':
              args += ['--anime-ids', '21639,3327', '--max-works', '2', '--max-episodes', '6', '--episodes-per-work', '3', '--runtime-seconds', '600']
          else:
              for flag, key, default in [('--anime-ids','ANIME_IDS',''), ('--catalog-pages','CATALOG_PAGES','1'), ('--max-works','MAX_WORKS','2'), ('--max-episodes','MAX_EPISODES','6'), ('--delay','DELAY_SECONDS','1')]:
                  args += [flag, os.environ.get(key) or default]
              if pathlib.Path('crawl-resume/checkpoint.json').is_file():
                  args += ['--resume-dir', 'crawl-resume']
          raise SystemExit(subprocess.call(args))
          PY
      - name: Write collection counts
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          file = pathlib.Path('crawl-output/summary.json')
          if file.is_file():
              data = json.loads(file.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('## Linkani subtitle collection\n\n```json\n' + json.dumps(data, ensure_ascii=False, indent=2) + '\n```\n')
          PY
      - name: Save subtitles and resumable checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkani-subtitles
          path: crawl-output/
          if-no-files-found: warn
          retention-days: 14

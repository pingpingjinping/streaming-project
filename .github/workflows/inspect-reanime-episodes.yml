name: Inspect ReAnime episode pagination
on:
  push:
    branches: [codex/fix-reanime-episode-pagination]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read public episode response shapes
        run: |
          node --input-type=module <<'JS'
          const base='https://reanime.to/api/v1/anime/you-re-under-arrest-tv-m29pp3';
          for (const suffix of ['', '/episodes', '/episodes?limit=100&offset=0','/episodes?limit=30&offset=30','/episodes?page=2&limit=30']) {
            try {
              const res=await fetch(base+suffix,{headers:{Accept:'application/json','User-Agent':'Mozilla/5.0',Referer:'https://reanime.to/'},signal:AbortSignal.timeout(12000)});
              if (!res.ok) { console.log(JSON.stringify({suffix,status:res.status}));continue; }
              const j=await res.json();const rows=Array.isArray(j)?j:Array.isArray(j.data)?j.data:[];
              const rest=Object.fromEntries(Object.entries(j).filter(([k,v])=>k!=='data'&& !Array.isArray(v)&& (v===null||typeof v!=='object'||/meta|pagination/.test(k))));
              console.log(JSON.stringify({suffix,status:res.status,keys:Object.keys(j),metadata:rest,count:rows.length,first:rows[0],last:rows.at(-1)}));
            } catch(e) { console.log(JSON.stringify({suffix,error:String(e)})); }
          }
          JS

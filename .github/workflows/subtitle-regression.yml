name: Subtitle regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/test-subtitle-episodes.cjs'
      - 'package*.json'
      - '.github/workflows/subtitle-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/test-subtitle-episodes.cjs'
      - 'package*.json'
      - '.github/workflows/subtitle-regression.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:subtitles
      - run: npm run build

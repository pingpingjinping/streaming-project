name: Subtitle regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/test-*.cjs'
      - 'scripts/winpng/**'
      - 'scripts/*subtitle-cache*.cjs'
      - 'Dockerfile'
      - 'scripts/*.py'
      - 'package*.json'
      - '.github/workflows/subtitle-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/test-*.cjs'
      - 'scripts/winpng/**'
      - 'scripts/*subtitle-cache*.cjs'
      - 'Dockerfile'
      - 'scripts/*.py'
      - 'package*.json'
      - '.github/workflows/subtitle-regression.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: subtitle_test
          POSTGRES_PASSWORD: subtitle_test
          POSTGRES_DB: subtitle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U subtitle_test -d subtitle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REVIEWED_TEST_DATABASE_URL: postgres://subtitle_test:subtitle_test@localhost:5432/subtitle_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/import-anime-db.py scripts/update-anime-db-release.py scripts/import-reviewed-subtitles.py scripts/refresh-reviewed-subtitle-links.py
      - run: python -m unittest discover -s scripts -p test_reviewed_db_import.py -v
      - run: python -m unittest discover -s scripts -p test_refresh_reviewed_subtitle_links.py -v
      - run: python -m unittest discover -s scripts -p test_split_registry_import.py -v
      - run: python -m unittest discover -s scripts -p test_weekly_aniall.py -v
      - run: python -m unittest discover -s scripts -p test_catalog_core.py -v
      - run: python -m unittest discover -s scripts -p test_export_reviewed_subtitle_links.py -v
      - run: python -m unittest discover -s scripts -p test_export_db_search_posters.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:subtitles
      - run: npm run build


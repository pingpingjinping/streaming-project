name: Read-only selected season provider checks
on:
  push:
    branches: ['codex/hellmode-readonly-probe-20261012']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read public episode metadata without requesting video streams
        run: |
          node <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),ts=require('typescript');
          function load(file,deps={}) {
            const exports={};
            const code=ts.transpileModule(fs.readFileSync(file,'utf8'),{compilerOptions:{module:ts.ModuleKind.CommonJS,target:ts.ScriptTarget.ES2022}}).outputText;
            vm.runInNewContext(code,{exports,require:name=>deps[name]||require(name),fetch,URL,AbortSignal,console});
            return exports;
          }
          const provider=load('src/lib/providers/anikoto.ts',{
            '@/lib/db':{DEFAULT_ANIKOTO_URL:'https://anikoto.cz',getAnikotoBaseUrl:async()=>'https://anikoto.cz'},
            '@/lib/chromiumFetch':{fetchHtmlWithChromium:async()=>{throw Error('Browser fallback was not used in this check');}},
            './ids':load('src/lib/providers/ids.ts'),
            '@/lib/anikotoCatalog':load('src/lib/anikotoCatalog.ts'),
          });
          (async()=>{
            for(const id of ["ak_one-piece-wano-kuni-sp-r0xwk","ak_fairy-gone-season-1-part-2-uyi61","ak_gintama-season-4-xolmv","ak_gintama-season-5-gz9uz","ak_swallowed-star-2nd-season-vsdyj","ak_ginga-eiyuu-densetsu-die-neue-these-4th-season-gt8lv"]) {
              const d=await provider.getAnimeDetail(id);
              if(!d){console.log(JSON.stringify({id,status:'FAILED: no public detail/episode response'}));continue;}
              const numbers=d.sub_episodes.map(e=>e.number);
              const path=d.sub_episodes[0]?.watch_url ? new URL(d.sub_episodes[0].watch_url).pathname.split('/ep-')[0] : '';
              console.log(JSON.stringify({id,status:'OK',title:d.title,original:d.original_title,episodeCount:numbers.length,firstEpisode:numbers[0],lastEpisode:numbers[numbers.length-1],numbers,canonicalPath:path}));
            }
            for(const id of ['urusei-yatsura-2022-season-3-djb8eh','pok-mon-concierge-season-1-part-2-ujrvk5']) {
              const response=await fetch('https://reanime.to/api/anime/'+encodeURIComponent(id),{signal:AbortSignal.timeout(15000)});
              if(!response.ok){console.log(JSON.stringify({source:'ReAnime',id,status:'FAILED',http:response.status}));continue;}
              const text=await response.text();try{const raw=JSON.parse(text);console.log(JSON.stringify({source:'ReAnime',id,status:'OK',metadata:raw.data||raw}));}catch{console.log(JSON.stringify({source:'ReAnime',id,status:'FAILED: non-JSON response'}));}
            }
            const response=await fetch('https://api.anissia.net/anime/animeNo/3485',{signal:AbortSignal.timeout(15000)});
            if(response.ok){const j=await response.json(),d=j.data;console.log(JSON.stringify({source:'Anissia',animeNo:d?.animeNo,subject:d?.subject,originalSubject:d?.originalSubject}));}
            else console.log(JSON.stringify({source:'Anissia',status:response.status}));
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS

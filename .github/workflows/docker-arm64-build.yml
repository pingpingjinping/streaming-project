name: Docker ARM64 Build and Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'data/**'
      - 'package*.json'
      - '*config*'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-arm64-build.yml'

concurrency:
  group: arm64-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Pi deployment helper
        run: python3 -m unittest discover -s scripts -p test_pi_image_deploy.py -v

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Verify ARM64 runtime and database health
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: bash scripts/test-arm64-image.sh "$TEST_IMAGE"

      # PRs and dispatches on other branches only build/test; they never publish.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"
          docker tag "$IMAGE_NAME:sha-$GITHUB_SHA" "$IMAGE_NAME:main-arm64"
          docker push "$IMAGE_NAME:main-arm64"
          {
            echo '### ARM64 image ready'
            echo "\`$IMAGE_NAME:sha-$GITHUB_SHA\`"
            echo '```bash'
            echo "bash scripts/deploy-pi-image.sh $IMAGE_NAME:sha-$GITHUB_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
